version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ganaderia_postgres
    restart: always
    environment:
      - POSTGRES_DB=ganaderia_db
      - POSTGRES_USER=ganadero
      - POSTGRES_PASSWORD=ganadero_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganadero -d ganaderia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ganaderia_web
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://ganadero:ganadero_secure_pass@db:5432/ganaderia_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=django-insecure-docker-key-for-local-testing
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
