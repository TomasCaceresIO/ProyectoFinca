<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Ganadera{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="navbar-brand">
            🐄 Gestión Ganadera
        </a>
        <ul class="navbar-nav">
            <li><a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home / Censo</a></li>
            <li><a href="{% url 'incidencias' %}" {% if 'incidencia' in request.resolver_match.url_name %}class="active"{% endif %}>Incidencias</a></li>
            <li><a href="{% url 'finca_list' %}" {% if 'finca' in request.resolver_match.url_name %}class="active"{% endif %}>Fincas y Recintos</a></li>
        </ul>
    </nav>

    <!-- Mensajes Django -->
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Contenido principal -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
